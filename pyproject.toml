[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borrowed-intimacy-api"
version = "0.1.0"
description = "OSINT discovery service for Borrowed Intimacy"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "networkx>=2.8,<3",
  "sherlock-project>=0.16,<0.17",
  "maigret>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.setuptools.packages.find]
include = ["apps*"]
